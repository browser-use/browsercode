name: cdp-url-guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cdp-url-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Fail on hand-built CDP URLs
        run: python3 tools/cdp-url-guard/check.py
